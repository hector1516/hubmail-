name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t eccsa/hubmail:latest .

      - name: Stop old container
        run: docker rm -f hubmail
        continue-on-error: true

      - name: Start new container
        run: >
          docker run -d --name hubmail --restart unless-stopped
          -p 8502:8502 -v hubmail_data:/data
          -e HUBMAIL_DB_NAME=HUBMAIL
          -e HUBMAIL_DB_SERVER=172.17.0.1
          -e HUBMAIL_DB_USER=hubmail
          -e HUBMAIL_DB_PASSWORD=eyccazo
          -e HUBMAIL_USERS_DB_NAME=ECCSA_Admon_Pruebas
          -e HUBMAIL_USERS_DB_SERVER=172.26.117.220
          -e HUBMAIL_DEEPL_KEY=4588b06b-6615-455a-ab62-2062d7bf6119:fx
          eccsa/hubmail:latest

      - name: Show logs
        run: docker logs --tail 10 hubmail
